<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Запись на консультацию</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #1d2433;
      --muted: #6b7385;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 16px;
    }
    .card {
      background: var(--card);
      width: 100%;
      max-width: 720px;
      padding: 32px 28px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(30, 40, 90, .1);
      overflow: hidden;
    }
    h1 { margin: 0 0 6px; font-size: 1.6rem; }
    .lead { margin: 0 0 24px; color: var(--muted); }
    .form-wrap { width: 100%; }
    .form-wrap iframe {
      display: block;
      width: 100%;
      max-width: 100%;
      border: 0;
    }
    @media (max-width: 420px) { .card { padding: 24px 16px; } }
  </style>
</head>
<body>
  <main class="card">
    <h1>Запись на консультацию</h1>
    <p class="lead">Оставьте данные — мы свяжемся с вами и подтвердим время.</p>

    <div class="form-wrap">
      <script src="https://forms.yandex.ru/_static/embed.js"></script>
      <iframe src="https://forms.yandex.ru/u/6ae75959852af3e4facf95d0?iframe=1" frameborder="0" name="ya-form-6ae75959852af3e4facf95d0" width="100%"></iframe>
    </div>
  </main>
</body>
</html>
