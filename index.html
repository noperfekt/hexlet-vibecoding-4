<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Запись на консультацию</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #1d2433;
      --muted: #6b7385;
      --accent: #4f46e5;
      --accent-dark: #4338ca;
      --border: #d9deea;
      --error: #d93636;
      --ok: #1f9d55;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      background: var(--card);
      width: 100%;
      max-width: 460px;
      padding: 32px 28px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(30, 40, 90, .1);
    }
    h1 { margin: 0 0 6px; font-size: 1.6rem; }
    .lead { margin: 0 0 24px; color: var(--muted); }
    label { display: block; margin-bottom: 16px; font-weight: 600; font-size: .9rem; }
    input, select, textarea {
      width: 100%;
      margin-top: 6px;
      padding: 11px 12px;
      font: inherit;
      font-weight: 400;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
    }
    input:focus, select:focus, textarea:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
      border-color: transparent;
    }
    textarea { resize: vertical; min-height: 80px; }
    .row { display: flex; gap: 12px; }
    .row label { flex: 1; }
    .error { color: var(--error); font-size: .8rem; font-weight: 400; min-height: 1em; display: block; margin-top: 4px; }
    button {
      width: 100%;
      padding: 13px;
      font: inherit;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      transition: background .15s;
    }
    button:hover { background: var(--accent-dark); }
    .success { display: none; text-align: center; padding: 12px 0; }
    .success .icon { font-size: 3rem; color: var(--ok); }
    .success p { color: var(--muted); }
    .success button { margin-top: 12px; }
    @media (max-width: 420px) { .row { flex-direction: column; gap: 0; } }
  </style>
</head>
<body>
  <main class="card">
    <form id="form" novalidate>
      <h1>Запись на консультацию</h1>
      <p class="lead">Оставьте данные — мы свяжемся с вами и подтвердим время.</p>

      <label>Имя
        <input type="text" name="name" placeholder="Иван Петров" required autocomplete="name">
        <span class="error" data-for="name"></span>
      </label>

      <label>Телефон
        <input type="tel" name="phone" placeholder="+7 900 123-45-67" required autocomplete="tel">
        <span class="error" data-for="phone"></span>
      </label>

      <label>Email
        <input type="email" name="email" placeholder="you@example.com" autocomplete="email">
        <span class="error" data-for="email"></span>
      </label>

      <label>Тема консультации
        <select name="topic" required>
          <option value="">Выберите тему</option>
          <option>Общий вопрос</option>
          <option>Подбор услуги</option>
          <option>Техническая поддержка</option>
          <option>Другое</option>
        </select>
        <span class="error" data-for="topic"></span>
      </label>

      <div class="row">
        <label>Дата
          <input type="date" name="date" required>
          <span class="error" data-for="date"></span>
        </label>
        <label>Время
          <select name="time" required>
            <option value="">—</option>
          </select>
          <span class="error" data-for="time"></span>
        </label>
      </div>

      <label>Комментарий
        <textarea name="comment" placeholder="Коротко опишите вопрос (необязательно)"></textarea>
      </label>

      <button type="submit">Записаться</button>
    </form>

    <div class="success" id="success">
      <div class="icon">✓</div>
      <h1>Вы записаны!</h1>
      <p id="summary"></p>
      <button type="button" id="again">Новая запись</button>
    </div>
  </main>

  <script>
    const form = document.getElementById('form');
    const success = document.getElementById('success');
    const summary = document.getElementById('summary');
    const dateInput = form.date;
    const timeSelect = form.time;

    // Даты: от сегодня
    const today = new Date();
    const iso = d => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    dateInput.min = iso(today);

    // Слоты 10:00–18:00 каждый час
    for (let h = 10; h <= 18; h++) {
      const t = String(h).padStart(2, '0') + ':00';
      timeSelect.add(new Option(t, t));
    }

    function setError(name, msg) {
      form.querySelector(`[data-for="${name}"]`).textContent = msg || '';
    }

    function validate() {
      let ok = true;
      const v = n => form[n].value.trim();
      const rules = {
        name: () => v('name').length < 2 && 'Введите имя',
        phone: () => v('phone').replace(/\D/g, '').length < 10 && 'Введите корректный телефон',
        email: () => v('email') && !/^\S+@\S+\.\S+$/.test(v('email')) && 'Некорректный email',
        topic: () => !v('topic') && 'Выберите тему',
        date: () => (!v('date') ? 'Выберите дату' : v('date') < dateInput.min && 'Дата в прошлом'),
        time: () => !v('time') && 'Выберите время',
      };
      for (const [name, check] of Object.entries(rules)) {
        const msg = check();
        setError(name, msg);
        if (msg) ok = false;
      }
      return ok;
    }

    form.addEventListener('submit', e => {
      e.preventDefault();
      if (!validate()) return;
      const data = Object.fromEntries(new FormData(form));
      // Здесь можно отправить data на сервер через fetch
      console.log('Заявка:', data);
      const date = new Date(data.date).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
      summary.textContent = `${data.name}, ждём вас ${date} в ${data.time}. Мы позвоним на ${data.phone} для подтверждения.`;
      form.style.display = 'none';
      success.style.display = 'block';
    });

    document.getElementById('again').addEventListener('click', () => {
      form.reset();
      success.style.display = 'none';
      form.style.display = 'block';
    });
  </script>
</body>
</html>
